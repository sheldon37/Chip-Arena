name: Native Unity conversion source checks
on:
  push:
    branches: [codex/unity-conversion, codex/unity-build-fix]
    paths: ['unity/ChipArenaConversion/**', '.github/workflows/unity-conversion.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: unity-conversion-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout: unity/ChipArenaConversion
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '8.0.x'
      - name: Native source parity, managed regressions and real relay
        run: python3 unity/ChipArenaConversion/tools/check_relay.py
      - name: Source package validation
        run: |
          python3 -m unittest discover -s unity/ChipArenaConversion/Tests -p 'test_*.py'
          python3 unity/ChipArenaConversion/tools/package_source.py
      - name: Retain private conversion source
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: Chip-Arena-Native-Conversion-Source
          path: |
            unity/ChipArenaConversion/Builds/Chip-Arena-Native-Conversion-Source.zip
            unity/ChipArenaConversion/Builds/Chip-Arena-Native-Conversion-Source.zip.sha256
          if-no-files-found: error
          retention-days: 30
