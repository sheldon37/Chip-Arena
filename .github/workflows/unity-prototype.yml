name: Unity prototype source checks
on:
  push:
    branches: [codex/unity-prototype]
    paths: ['unity/ChipArenaPrototype/**', '.github/workflows/unity-prototype.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: unity-prototype-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout: unity/ChipArenaPrototype
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '8.0.x'
      - name: Compile and run actual managed-core tests
        run: dotnet run --project unity/ChipArenaPrototype/Tests/CoreTests.csproj -c Release
      - name: Validate and package Unity source only
        run: python3 unity/ChipArenaPrototype/tools/package_source.py
      - name: Retain private test source
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: Chip-Arena-Unity-TEST-Source
          path: |
            unity/ChipArenaPrototype/Builds/Chip-Arena-Unity-TEST-Source.zip
            unity/ChipArenaPrototype/Builds/Chip-Arena-Unity-TEST-Source.zip.sha256
          if-no-files-found: error
          retention-days: 30
