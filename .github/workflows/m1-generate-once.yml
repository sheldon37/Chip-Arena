name: Materialize verified M1 map data once
on:
  push:
    branches: ['codex/unity-m1-stages-training']
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: codex/unity-m1-stages-training
      - name: Generate and verify the tested map data
        shell: bash
        run: |
          python3 unity/ChipArenaConversion/tools/generate_stage_hazards.py
          test "$(git hash-object unity/ChipArenaConversion/Assets/Conversion/Resources/UnityMaps.json)" = ec90a432c25f4b7135427a7f564972513c8c84bc
          test "$(git hash-object unity/ChipArenaConversion/tools/asset-lock.json)" = 10185ea6b5f7d86e99147ea02d058c2aa27c5fc9
          git rm .github/workflows/m1-generate-once.yml
          git add unity/ChipArenaConversion/Assets/Conversion/Resources/UnityMaps.json unity/ChipArenaConversion/tools/asset-lock.json
          git -c user.name=Codex -c user.email=codex@openai.com commit -m "Materialize verified M1 map assets and remove one-off generator"
          git push origin HEAD:codex/unity-m1-stages-training
