name: Checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  scope:
    runs-on: ubuntu-24.04
    outputs:
      mode: ${{ steps.scope.outputs.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            echo 'mode=full' >> "$GITHUB_OUTPUT"
          else
            node scripts/ci-scope.mjs
          fi
      - name: Whitespace check
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            git diff --check "$BASE_SHA" "$HEAD_SHA"
          else
            git show --format= --check HEAD
          fi
  verify:
    needs: scope
    if: needs.scope.outputs.mode != 'docs'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm run setup
      - name: Verify selected scope
        env:
          CHECK_SCOPE: ${{ needs.scope.outputs.mode }}
        run: |
          if [ "$CHECK_SCOPE" = full ]; then
            npm run verify
          else
            npm run verify:standard
          fi
      - name: Retain verification logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: check-logs-${{ github.run_id }}
          path: test-results/*.log
          retention-days: 7
          if-no-files-found: ignore
  gate:
    name: Required checks
    if: always()
    needs: [scope, verify]
    runs-on: ubuntu-24.04
    steps:
      - env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          CHECK_MODE: ${{ needs.scope.outputs.mode }}
          VERIFY_RESULT: ${{ needs.verify.result }}
        run: |
          test "$SCOPE_RESULT" = success
          if [ "$CHECK_MODE" = docs ]; then
            test "$VERIFY_RESULT" = skipped
          else
            test "$VERIFY_RESULT" = success
          fi
